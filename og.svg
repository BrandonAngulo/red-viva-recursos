<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#09261c"/>
  
  <!-- Subtle background pattern -->
  <path d="M0 500 Q 300 450, 600 500 T 1200 500 M0 550 Q 300 500, 600 550 T 1200 550" fill="none" stroke="#d7ef5e" stroke-width="2" opacity="0.1"/>
  
  <!-- Icon: Database with Download/Sync Arrow -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="140" height="140" rx="35" fill="#0d3b2c" stroke="#d7ef5e" stroke-width="4"/>
    
    <!-- Database cylinder -->
    <ellipse cx="60" cy="50" rx="25" ry="10" fill="none" stroke="#d7ef5e" stroke-width="6"/>
    <path d="M35 50 V90 C35 100, 85 100, 85 90 V50" fill="none" stroke="#d7ef5e" stroke-width="6" stroke-linecap="round"/>
    <path d="M35 70 C35 80, 85 80, 85 70" fill="none" stroke="#d7ef5e" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Download / Flow Arrow -->
    <path d="M100 45 V90 M85 75 L100 90 L115 75" fill="none" stroke="#d7ef5e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Content -->
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1">Central de</text>
  <text x="80" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="92" font-weight="900" fill="#d7ef5e" letter-spacing="-1">Recursos Digitales</text>
  
  <text x="80" y="520" font-family="Georgia, serif" font-size="46" font-style="italic" fill="#cfe0d6">Respuesta al sismo en</text>
  <text x="1120" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#cfe0d6" text-anchor="end" letter-spacing="12">COLOMBIA</text>
</svg>
